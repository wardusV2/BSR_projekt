# ???????????????????????????????????????????????????????????????????

# Adresy bazowe satelit ? dostosuj porty do swojego ?rodowiska
satellite.health.urls=\
  Service1=http://localhost:8082,\
  Service2=http://localhost:8083,\
  Service3=http://localhost:8084,\
  Service4=http://localhost:8085,\
  Service5=http://localhost:8086,\
  Service6=http://localhost:8087,\
  Service7=http://localhost:8088

# Co ile ms sprawdza? zdrowie satelit (domy?lnie 15 s)
satellite.health.check-interval-ms=15000

# Po ilu ms braku odpowiedzi wys?a? alert (domy?lnie 45 s)
satellite.health.alert-threshold-ms=45000

